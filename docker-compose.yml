version: '3.8'

services:
  # Main analysis service
  sales-analyzer:
    build: .
    container_name: ecommerce-sales-analyzer
    volumes:
      # Mount visualizations directory to persist output
      - ./visualizations:/app/visualizations
      - ./visualizations/book_histograms:/app/visualizations/book_histograms
    environment:
      - PYTHONUNBUFFERED=1
    command: python fixed_model.py

  # Data validation service
  data-validator:
    build: .
    container_name: ecommerce-data-validator
    volumes:
      - ./visualizations:/app/visualizations
    command: python analyze_json.py

  # Histogram generator service
  histogram-generator:
    build: .
    container_name: ecommerce-histogram-gen
    volumes:
      - ./visualizations/book_histograms:/app/visualizations/book_histograms
    command: python plot_salesrank_histograms.py

  # Interactive analysis environment
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: ecommerce-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: start-notebook.sh --NotebookApp.token='${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in your .env file — never ship an empty notebook token}'

  # FastAPI service for predictions
  book-api:
    build: .
    container_name: ecommerce-book-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=8001
    command: python book_api.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

# Volumes for persistent data
volumes:
  visualizations:
  book_histograms:
